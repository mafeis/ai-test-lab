<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Test Lab · AI 效果测试场</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>AI Test Lab</h1>
      <span class="brand-sub">AI 效果测试场</span>
    </div>
    <nav class="filters" id="filters" aria-label="分类筛选"></nav>
  </div>
</header>

<div class="layout">
  <!-- 左侧：测试列表 -->
  <aside class="sidebar">
    <div class="sidebar-head" id="sidebar-head">测试列表</div>
    <div class="testlist" id="testlist"></div>
  </aside>

  <!-- 右侧：共用大播放器（剧场） -->
  <section class="stage-wrap">
    <div class="stage" id="stage"></div>
    <div class="stage-bar" id="stagebar" style="display:none"></div>
    <div id="reelnav"></div>
    <div class="detail" id="detail" style="display:none"></div>
  </section>
</div>

<footer class="footer">
  <strong>新增测试</strong>（不用改任何代码）：
  ① 在 <code>data/tests/</code> 新建一个 <code>.json</code>（字段见现有文件）；
  ② 在 <code>data/manifest.json</code> 的 <code>tests</code> 数组里加一行路径。
  刷新即见；URL 加 <code>#测试id</code> 可直达。
  <a href="https://github.com/mafeis/ai-test-lab">github.com/mafeis/ai-test-lab</a>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
