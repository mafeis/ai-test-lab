<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Test Lab · 动画播放器</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --line: #e6eaf1;
    --txt: #1f2937;
    --dim: #6b7280;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 14px;
    line-height: 1.7;
    padding: 40px 32px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  h1::before {
    content: "";
    width: 4px; height: 22px;
    background: var(--accent);
    border-radius: 2px;
    flex: none;
  }
  .sub { font-size: 12.5px; color: var(--dim); margin: 8px 0 32px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 760px) {
    body { padding: 24px 16px; }
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    padding: 16px;
  }
  .card video {
    width: 100%;
    border-radius: 8px;
    background: #0f172a;
    display: block;
  }
  .card h2 { font-size: 16px; margin: 12px 0 4px; }
  .meta { font-size: 12.5px; color: var(--dim); }
  .badges { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font-size: 11.5px;
    padding: 1px 10px;
    border-radius: 99px;
    background: rgba(37,99,235,.10);
    color: var(--accent);
  }
  .badge.green { background: rgba(5,150,105,.12); color: #059669; }
  .empty {
    text-align: center;
    color: var(--dim);
    padding: 48px 0;
    border: 1px dashed var(--line);
    border-radius: 12px;
  }
  footer { margin-top: 36px; font-size: 12.5px; color: var(--dim); }
  footer a { color: var(--accent); text-decoration: none; }
  @media print {
    .card { box-shadow: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Test Lab · 动画播放器</h1>
  <p class="sub">仓库内所有 AI 生成动画，点击画面即可播放 · 最后更新 2026-09-17</p>

  <div class="grid">
    <div class="card">
      <video controls preload="metadata" src="images/miku_dance.mp4"></video>
      <h2>miku_dance.mp4</h2>
      <p class="meta">约 5.0 MB · MP4 · 由 Qwen 生成</p>
      <div class="badges">
        <span class="badge">动画</span>
        <span class="badge green">Qwen</span>
      </div>
    </div>
  </div>

  <footer>
    新增动画：把 mp4 放入 <code>images/</code> 目录后，在 <code>index.html</code> 的 grid 中复制一张 card 并改视频路径即可。
    在线仓库：<a href="https://github.com/mafeis/ai-test-lab">github.com/mafeis/ai-test-lab</a>
  </footer>
</div>
</body>
</html>
