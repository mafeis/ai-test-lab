<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Test Lab · 动画播放器</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --line: #e6eaf1;
    --txt: #1f2937; --dim: #6b7280; --accent: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 14px; line-height: 1.7; padding: 40px 32px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  h1::before { content: ""; width: 4px; height: 22px; background: var(--accent); border-radius: 2px; flex: none; }
  .sub { font-size: 12.5px; color: var(--dim); margin: 8px 0 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 760px) { body { padding: 24px 16px; } .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 16px;
  }
  .card video, .card img.thumb { width: 100%; border-radius: 8px; background: #0f172a; display: block; }
  .card h2 { font-size: 16px; margin: 12px 0 4px; }
  .meta { font-size: 12.5px; color: var(--dim); }
  .badges { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 11.5px; padding: 1px 10px; border-radius: 99px; background: rgba(37,99,235,.10); color: var(--accent); }
  .badge.green { background: rgba(5,150,105,.12); color: #059669; }
  .badge.amber { background: rgba(217,119,6,.12); color: #b45309; }
  .badge.gray { background: rgba(107,114,128,.12); color: #4b5563; }
  details.info { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; }
  details.info summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 12.5px; user-select: none; }
  details.info table { margin-top: 8px; width: 100%; border-collapse: collapse; }
  details.info td { vertical-align: top; padding: 3px 8px 3px 0; font-size: 12.5px; }
  details.info td.k { color: var(--dim); white-space: nowrap; width: 5.5em; }
  details.info ul { margin: 6px 0 0 1.4em; font-size: 12.5px; }
  details.info li { margin: 2px 0; }
  .links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; }
  .links a { color: var(--accent); text-decoration: none; }
  footer { margin-top: 36px; font-size: 12.5px; color: var(--dim); }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Test Lab · 动画播放器</h1>
  <p class="sub">仓库内所有 AI 生成动画，点击画面即可播放 · 每张卡片下方直接展示测试详情（目标/输入/消耗/过程/链接）· 最后更新 2026-09-17</p>
  <div class="grid" id="grid"></div>
  <footer>
    <strong>新增测试</strong>：只需两步 —— ① 把视频放入 <code>images/</code>；② 在本文件顶部
    <code>TESTS</code> 数组里加一条数据（视频路径 + 总结字段），卡片自动生成，无需改页面结构。<br>
    在线仓库：<a href="https://github.com/mafeis/ai-test-lab">github.com/mafeis/ai-test-lab</a>
  </footer>
</div>

<script>
/* ============ 测试数据：新增测试只改这里 ============ */

      ["限制", "H3 训练帧范围 124–362 帧（5–15s），30s 原片无法单次重生成，故输出 15s"],

    title: "H3 分辨率扫描 —— 同提示词 0.1→1.0 MP 全档位对比",
    media: { type: "video", src: "experiments/h3-res-sweep/res_comparison_hi.mp4", poster: "experiments/h3-res-sweep/comparison_strip_full10.png" },
    meta: "10 档全景（0.1→1.0MP）· 每档 5.17s @24fps · 同 seed 同提示词 · 生成耗时 10.5s→252.8s",
    badges: [
      ["参数扫描", ""],
      ["MiniMax H3", "green"],
      ["10 档全扫完", "green"],

    ],

      ["耗时", "0.1MP 10.5s → 1.0MP 252.8s，随像素量近似线性（24 倍像素 ≈ 24 倍耗时）"],
      ["质量", "<0.3MP 不可用；0.3-0.5MP 可用但风格抽卡；0.6MP 起全面进入高细节稳定区"],
      ["甜点", "0.6MP 全景深细节爆发（发丝/刺绣/观众席光点全清晰），相对 1.0MP 只需 45% 耗时"],
      ["饱和", "0.9→1.0MP 码率反降（5823→5479kbps）+ 耗时+20%，收益倒挂"],
    ],

    ],

      ["📄 扫描报告", "https://github.com/mafeis/ai-test-lab/blob/main/experiments/h3-res-sweep/README.md"],
      ["🔧 工作流资产", "https://github.com/mafeis/ai-test-lab/tree/main/experiments/h3-res-sweep"],

/* ============ 渲染模板：以下无需改动 ============ */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function renderCard(t) {
  const media = t.media.type === "video"
    ? `<video controls preload="metadata" src="${esc(t.media.src)}" poster="${esc(t.media.poster || "")}"></video>`
    : `<img class="thumb" src="${esc(t.media.src)}" alt="${esc(t.media.alt || "")}">`;

  const badges = t.badges.map(([label, cls]) =>
    `<span class="badge ${cls}">${esc(label)}</span>`).join("");

  const rows = t.info.map(([k, v]) =>
    `<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`).join("");

  const points = t.points.map(p => `<li>${esc(p)}</li>`).join("");

  const links = t.links.map(([label, url]) =>
    `<a href="${esc(url)}">${esc(label)}</a>`).join("");

  return `
  <div class="card">
    ${media}
    <h2>${esc(t.title)}</h2>
    <p class="meta">${esc(t.meta)}</p>
    <div class="badges">${badges}</div>
    <details class="info" open>
      <summary>测试详情（点击收起）</summary>
      <table>${rows}</table>
      <ul>${points}</ul>
      <div class="links">${links}</div>
    </details>
  </div>`;
}

document.getElementById("grid").innerHTML = TESTS.map(renderCard).join("");
</script>
</body>
</html>
