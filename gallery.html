<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Lab · 图片效果测试场</title>
<link rel="stylesheet" href="assets/gallery.css?v=20260918k">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1><a href="index.html" class="back" title="返回视频播放页">⌂</a>Image Lab</h1>
      <span class="brand-sub">图片效果测试场 · 与视频播放页数据分离</span>
    </div>
    <nav class="filters" id="filters" aria-label="分类筛选"></nav>
  </div>
</header>

<div class="layout">
  <!-- 左：图片查看区 -->
  <section class="stage-wrap">
    <div id="viewer"></div>
    <div class="detail" id="detail" style="display:none"></div>
  </section>

  <!-- 右：图片测试清单 -->
  <aside class="sidebar">
    <div class="sidebar-head">图片测试清单</div>
    <div class="testlist" id="testlist"></div>
  </aside>
</div>

<footer class="footer">
  <strong>新增图片测试</strong>（不改代码）：
  ① 在 <code>data/image-tests/</code> 新建一个 <code>.json</code>（schema 参考 <code>dunhuang-t2i-upscale.json</code>）；
  ② 在 <code>data/images-manifest.json</code> 的 <code>tests</code> 数组加一行路径。
  刷新即见；URL 加 <code>#测试id</code> 可直达。对比滑杆支持任意档位组合（在 JSON 的 <code>modes</code> 里配）。
  <a href="https://github.com/mafeis/ai-test-lab">github.com/mafeis/ai-test-lab</a>
</footer>

<script src="assets/gallery.js?v=20260918k"></script>
</body>
</html>
